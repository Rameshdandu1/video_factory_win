[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-generation-app"
version = "0.0.0"
description = "Application layer for a Wan2.1-backed video generation product"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn==0.51.0",
]

[project.scripts]
video-app-api = "video_app.bootstrap:api_main"
video-app-worker = "video_app.bootstrap:worker_main"

[project.optional-dependencies]
dev = [
  "alembic==1.19.0",
  "httpx==0.28.1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires CUDA, model weights, and explicit opt-in",
  "integration: crosses a process or infrastructure boundary",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true
