name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Parse deployment entrypoints
        shell: bash
        run: |
          bash -n scripts/runpod-install.sh
          bash -n scripts/runpod-bootstrap.sh
          bash -n scripts/runpodctl
      - name: Lint deployment entrypoints
        run: shellcheck scripts/runpod-install.sh scripts/runpod-bootstrap.sh scripts/runpodctl

  deployment-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test deployment package with pytest entrypoint
        run: pytest -q tests/deployment
      - name: Test deployment package with Python module entrypoint
        run: python -m pytest -q tests/deployment

  runpod-installer-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application, development tools, and PostgreSQL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          sudo service postgresql stop
      - name: Exercise fresh and repeated installer database setup
        run: |
          python_bin="$(command -v python)"
          sudo VIDEO_FACTORY_RUNPOD_INSTALLER_ACCEPTANCE=1 \
            "${python_bin}" -m pytest -q \
            tests/deployment/test_runpod_installer_acceptance.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -m "not gpu"

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format
      - name: Lint frontend
        run: npm run lint
      - name: Type check frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: video_app
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: video_factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_app -d video_factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://video_app:integration-only-password@127.0.0.1:5432/video_factory
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://video_app:integration-only-password@127.0.0.1:5432/video_factory_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install application and migration tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Create isolated migration database
        env:
          PGPASSWORD: integration-only-password
        run: createdb -h 127.0.0.1 -U video_app video_factory_migration_test
      - name: Apply application migrations
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests without skips
        shell: bash
        run: |
          set -o pipefail
          pytest -m integration -ra \
            tests/integration/api \
            tests/integration/infrastructure \
            tests/integration/migrations \
            | tee integration-test.log
          if grep -q "SKIPPED" integration-test.log; then
            echo "PostgreSQL integration tests unexpectedly skipped"
            exit 1
          fi
